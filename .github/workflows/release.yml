# 태그(예: 1.0.1)를 push하면 빌드해서 BRAT용 GitHub Release를 만든다.
# 태그는 manifest.json의 version과 같아야 한다(v 접두사 없이).
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "tag $tag != manifest.json version $ver"; exit 1
          fi

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "BRAT 설치: ButtDev/happynote2" \
            main.js manifest.json styles.css
